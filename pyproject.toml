[project]
name = "spass-paper"
version = "0.1.0"
description = ""
authors = [
    {name = "David Hwang", email = "noritheyellow@gmail.com"}
]
readme = "README.md"
requires-python = "3.11.9"
dependencies = [
    "pandas == 2.2.3",
    "numpy (==1.24.4)",
    "ipykernel == 6.29.5",
    "scikit-learn == 1.6.1",
    "psycopg2-binary == 2.9.10",
    "vitaldb == 1.4.11",
    "pyarrow == 19.0.1",
    "pyyaml == 6.0.2",
    "seaborn == 0.13.2",
    "tqdm == 4.67.1",
    "statsmodels == 0.14.5",
    "tensorflow-macos == 2.16.2",
    "tensorflow-metal == 1.2.0",
    "emd-signal (>=1.6.4,<2.0.0)",
    "emd (>=0.8.1,<0.9.0)",
    "sktime (>=0.37.0,<0.38.0)",
    "tslearn (>=0.6.3,<0.7.0)",
    "torch (>=2.7.1,<3.0.0)",
    "keras-tcn (>=3.5.6,<4.0.0)",
    "lightning (>=2.5.3,<3.0.0)",
    "h5py (>=3.14.0,<4.0.0)",
    "dtw-python (>=1.5.3,<2.0.0)",
    "dcurves (>=1.1.7,<2.0.0)",
    "xgboost (>=3.0,<4.0)",
]

[tool.poetry]
packages = [
    { include = "src" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
notebook = "^7.3.3"

